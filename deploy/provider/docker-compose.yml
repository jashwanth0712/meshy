# meshy-sync next to a NetBird self-hosted install (getting-started.sh), on
# NetBird's docker network so it reaches the management API directly and is
# published by NetBird's Traefik at https://sync.${NB_DOMAIN}.
#
# Use bootstrap.sh on a fresh Ubuntu host; it runs NetBird's installer,
# creates the owner + API token, and starts this file.
services:
  meshy-sync:
    build:
      context: ../..
      dockerfile: deploy/provider/meshy-sync.Dockerfile
    image: meshy-sync:local
    container_name: meshy-sync
    restart: unless-stopped
    networks: [netbird]
    env_file: .env
    volumes:
      # attestor.key (the provider's ProviderRegistry signer) + attestations.jsonl
      - ./state:/state
    command:
      - --listen=:8787
      - --sepolia=${MESHY_SEPOLIA}
      - --signer-key-file=/state/attestor.key
      - --state=/state
      - --cors=${MESHY_CORS}
      - --netbird-api=http://netbird-server:80
      - --netbird-management-url=https://${NB_DOMAIN}
      - --orgs=${MESHY_ORGS}
      - --subscription=${MESHY_SUBSCRIPTION}
      - --provider-registry=${MESHY_PROVIDER_REGISTRY}
      - --provider-id=${MESHY_PROVIDER_ID}
    labels:
      - traefik.enable=true
      - traefik.http.routers.meshy-sync.rule=Host(`sync.${NB_DOMAIN}`)
      - traefik.http.routers.meshy-sync.entrypoints=websecure
      - traefik.http.routers.meshy-sync.tls=true
      - traefik.http.routers.meshy-sync.tls.certresolver=letsencrypt
      - traefik.http.services.meshy-sync.loadbalancer.server.port=8787
networks:
  netbird:
    name: netbird_netbird
    external: true
